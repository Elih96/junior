name: amplitude
display-name: Amplitude
description: Read-only Amplitude analytics, replay, feedback, experiments, Wave, and data warehouse status

env-vars:
  AMPLITUDE_MCP_URL:
    default: https://mcp.amplitude.com/mcp

mcp:
  url: ${AMPLITUDE_MCP_URL}
  allowed-tools:
    - search
    - get_from_url
    - get_amplitude_context
    - query_amplitude_data
    - get_amplitude_charts
    - get_amp_user_data
    - get_experiments
    - query_experiment
    - get_flags
    - get_deployments
    - get_properties
    - get_transformations
    - get_group_types
    - get_session_replays
    - list_session_replays
    - get_session_replay_events
    - list_guides_surveys
    - get_guide_or_survey
    - query_wave_opportunities
    - query_wave_product_areas
    - use_amplitude_ai_feedback
    - get_agent_results
    - get_amplitude_agent_analytics_info
    - get_data_ingestion_sources
    - get_data_source_details
    - get_data_warehouse_destinations
    - get_data_warehouse_jobs
